<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f2" />
    <title>SMIS — School Management</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <dialog id="record-dialog" class="record-dialog">
      <form id="record-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">RECORD MANAGEMENT</span>
            <h2 id="dialog-title">Add record</h2>
          </div>
          <button class="icon-button" type="button" data-close-dialog aria-label="Close dialog">×</button>
        </div>
        <div id="form-fields" class="form-fields"></div>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-dialog>Cancel</button>
          <button class="button button-primary" type="submit">Save record <span aria-hidden="true">↗</span></button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
