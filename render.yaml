services:
  - type: web
    name: smis
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smis-db
          property: connectionString

databases:
  - name: smis-db
    databaseName: smis
    user: smis
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16
    diskSizeGB: 1
    ipAllowList: []
